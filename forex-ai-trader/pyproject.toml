[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forex-ai-trader"
version = "0.1.0"
description = "Trading automatico sul Forex con analisi quantitativa e ragionamento LLM (Claude), con gestione del rischio rigorosa."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "requests>=2.31",
  "anthropic>=1.0",
  "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
forex-trader = "forex_trader.cli:main"

[tool.setuptools.packages.find]
include = ["forex_trader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
