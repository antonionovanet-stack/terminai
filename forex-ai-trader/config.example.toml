# Copia in config.toml e adatta. Ogni sezione/chiave è opzionale.

[general]
broker = "mt5"             # mt5 | oanda
instruments = ["EUR_USD", "GBP_USD", "USD_JPY"]
poll_seconds = 60
journal_path = "journal/decisions.jsonl"

[reasoner]
kind = "hybrid"            # rules | claude | hybrid
hybrid_mode = "consensus"  # consensus: opera solo se regole e Claude concordano | llm_final: decide Claude
prefilter_score = 2.0      # consulta Claude solo se le regole vedono un possibile setup
# max_llm_calls = 100      # tetto di sicurezza ai costi (nessun limite se omesso)

[claude]
model = "claude-opus-5-5"
effort = "high"            # low | medium | high | xhigh | max
max_tokens = 16000

[risk]
risk_per_trade = 0.01      # 1% del capitale a rischio per operazione
max_open_trades = 3
max_trades_per_currency = 2
max_daily_loss = 0.03      # stop di giornata al -3%
max_drawdown = 0.15        # kill switch al -15% dal picco
min_confidence = 0.55
min_reward_risk = 1.2
max_spread_pips = 3.0
max_leverage = 10.0

[rules]
min_score = 3.5

[engine]
history_bars = 500
break_even_at_r = 1.0      # sposta lo stop a pareggio quando il profitto raggiunge 1R
dry_run = false

[mt5]
symbol_suffix = ""         # suffisso dei simboli del tuo broker, es. ".m" per EURUSD.m (vedi "Market Watch")
magic = 20261018           # il bot gestisce solo le posizioni con questo magic number
deviation_points = 20      # slippage massimo accettato, in punti
server_utc_offset_hours = 0  # molti broker usano UTC+2/+3: imposta l'offset per allineare le candele H4
# path = 'C:\Program Files\MetaTrader 5\terminal64.exe'

# Se i nomi non seguono lo schema BASEQUOTE+suffisso:
# [mt5.symbol_map]
# EUR_USD = "EURUSDpro"

[evolution]
auto = true                # durante `run` evolve da solo nel weekend, a mercato chiuso
every_days = 7
use_champion = true        # opera con la strategia campione evoluta (se esiste)
registry_path = "strategies/registry.json"
cache_dir = ".cache"
history_bars = 5000        # storico H1 per strumento usato dall'evoluzione (~10 mesi)

[evolution.search]
population = 20            # candidati per generazione
generations = 10
folds = 3                  # periodi walk-forward in addestramento
holdout_fraction = 0.3     # ultimo 30% dello storico: dati MAI visti, usati solo per decidere la promozione
min_holdout_trades = 10
promote_margin = 0.25      # quanto deve essere migliore del campione sui dati mai visti
max_holdout_drawdown_pct = 15.0
llm_proposals = 0          # >0: Claude analizza i risultati e propone N varianti ragionate (2 volte per sessione)
workers = 0                # processi paralleli, 0 = automatico
